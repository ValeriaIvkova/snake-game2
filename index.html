<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Змейка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrapper">
    <h1>Змейка</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="info">
      <div>Счёт: <span id="score">0</span></div>
      <button id="restart">Играть снова</button>
      <p class="hint">Управление: стрелки на клавиатуре или кнопки ниже</p>
    </div>

    <div class="controls" id="touch-controls">
      <div class="controls-row">
        <button class="ctrl-btn" data-dir="up">▲</button>
      </div>
      <div class="controls-row">
        <button class="ctrl-btn" data-dir="left">◀</button>
        <button class="ctrl-btn" data-dir="down">▼</button>
        <button class="ctrl-btn" data-dir="right">▶</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
